import java.util.jar.JarFile

plugins {
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = project.mod_version
group = project.maven_group
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

base {
    archivesName = project.archives_name
}

// The native extension has no Minecraft references and is isolated from the standard artifact.
sourceSets {
    jvmti
    cf {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    pro {
        java.srcDir 'src/pro/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases" }
    maven { name = "GeckoLib"; url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { name = "Progwml6"; url = "https://dvs1.progwml6.com/files/maven/" }
    maven { name = "BlameJared"; url = "https://maven.blamejared.com/" }
    maven { name = "ModMaven"; url = "https://modmaven.dev" }
}

neoForge {
    version = project.neo_version
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        server {
            server()
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
    }

    mods {
        eca { sourceSet sourceSets.main }
    }
}

dependencies {
    jvmtiCompileOnly 'net.java.dev.jna:jna:5.12.1'
    proImplementation files('lib/forgevm-0.7.0.jar')
    implementation 'org.reflections:reflections:0.9.12'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-analysis:9.7.1'
    implementation('io.netty:netty-codec-http:4.1.82.Final') { transitive = false }
    jarJar('io.netty:netty-codec-http') {
        transitive = false
        version { strictly '[4.1.82.Final,4.1.83.Final)'; prefer '4.1.82.Final' }
    }
    implementation('io.airlift:aircompressor:0.27') { transitive = false }
    jarJar('io.airlift:aircompressor') {
        transitive = false
        version { strictly '[0.27,0.28)'; prefer '0.27' }
    }
    implementation "software.bernie.geckolib:geckolib-neoforge-${project.minecraft_version}:${project.geckolib_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.mod_version
    }
}

tasks.named('processCfResources') {
    filteringCharset = 'UTF-8'
    inputs.property 'mod_version', project.mod_version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'mod_version': project.mod_version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    it.options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// ModDevGradle embeds the jarJar libraries in the main jar, so it is the _base jar the variants start from.
tasks.jar {
    archiveFileName.set("${project.archives_name}-${project.version}_base.jar")
    destinationDirectory = layout.buildDirectory.dir('intermediates/base')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'eca.mixins.dev.json'
}

// Agent JAR
tasks.register('agentJar', Jar) {
    group = 'build'
    dependsOn tasks.named('classes')
    archiveBaseName = 'agent'
    destinationDirectory = layout.buildDirectory.dir('embedded-agent')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        include 'net/eca/agent/**'
    }

    manifest {
        attributes(
                'Agent-Class': 'net.eca.agent.EcaAgent',
                'Premain-Class': 'net.eca.agent.EcaAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.named('jar') {
    dependsOn tasks.named('agentJar')

    from(tasks.named('agentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
}

// CF early coremod library (FML 10+). FML 10 loads ClassProcessorProvider services only from the launch class loader
// chain, which holds the FML Plugins loader: every FMLModType: LIBRARY jar (top-level or jar-in-jar) is put on it before
// the processor set is built (FMLLoader.loadPlugins -> createClassProcessorSet). A mod jar is game content and is never
// on it, so the CF processor is shipped as a nested LIBRARY jar holding only the self-contained processor closure.
tasks.register('cfCoremodJar', Jar) {
    group = 'build'
    description = 'Packages the CF ClassProcessorProvider as an FML LIBRARY jar for jar-in-jar.'
    dependsOn tasks.named('classes'), tasks.named('cfClasses')
    archiveFileName.set("eca-cf-coremod-${project.version}.jar")
    destinationDirectory = layout.buildDirectory.dir('embedded-cf-coremod')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.cf.output) {
        include 'net/eca/coremod/EcaTransformationService*', 'net/eca/coremod/RuntimeExtensionBridge*'
    }
    from(sourceSets.main.output) {
        include 'net/eca/coremod/EcaCoreTransformer*', 'net/eca/coremod/EcaClassProcessorProvider*'
        include 'net/eca/coremod/EarlyLogWriter*'
        include 'META-INF/services/net.neoforged.neoforgespi.transformation.ClassProcessorProvider'
    }
    manifest {
        attributes('FMLModType': 'LIBRARY', 'Automatic-Module-Name': 'net.eca.cfcoremod',
                'Implementation-Version': project.version)
    }
}

tasks.register('cfJarJarMetadata') {
    dependsOn tasks.named('jar')
    // Everything doLast reads: the version (the nested library's name and range) and the base jar (its jarJar list).
    // Without them Gradle keeps a stale metadata.json after a version change, which points at a jar that is not nested.
    inputs.property('version', project.version.toString())
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    def out = layout.buildDirectory.file('cf-jarjar/META-INF/jarjar/metadata.json')
    outputs.file(out)
    doLast {
        def base = tasks.named('jar').get().archiveFile.get().asFile
        def meta = [jars: []]
        new java.util.zip.ZipFile(base).withCloseable { z ->
            def e = z.getEntry('META-INF/jarjar/metadata.json')
            if (e != null) meta = new groovy.json.JsonSlurper().parse(z.getInputStream(e))
        }
        meta.jars = (meta.jars as List) + [[identifier: [group: 'net.eca', artifact: 'eca-cf-coremod'],
                version: [range: "[${project.version}]", artifactVersion: "${project.version}"],
                path: "META-INF/jarjar/eca-cf-coremod-${project.version}.jar", isObfuscated: false]]
        def f = out.get().asFile
        f.parentFile.mkdirs()
        f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(meta))
    }
}

tasks.register('cfJar', Jar) {
    group = 'build'
    description = 'Builds the CoreMod and Mixin variant without the optional runtime backends.'
    dependsOn tasks.named('jar'), tasks.named('cfClasses'), tasks.named('cfCoremodJar'), tasks.named('cfJarJarMetadata')
    archiveFileName.set("${project.archives_name}-${project.version}_cf.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'META-INF/neoforge.mods.toml'
        exclude 'net/eca/agent/**', 'net/eca/coremod/NativeRuntimeBridge*'
        exclude 'net/eca/coremod/EcaClassTransformer*', 'net/eca/coremod/AllReturnTransformer*'
        exclude 'net/eca/coremod/ContainerReplacementTransformer*', 'net/eca/coremod/LoadingScreenTransformer*'
        exclude 'net/eca/EcaMod.class', 'net/eca/event/LoadCompleteHandler*'
        exclude 'net/eca/coremod/EcaTransformationService*', 'net/eca/coremod/EcaTransformerManager*'
        exclude 'net/eca/coremod/RuntimeBytecodeProvider*', 'net/eca/coremod/RuntimeExtensionBridge*'
        exclude 'META-INF/jarjar/metadata.json'
    }
    from sourceSets.cf.output
    from(tasks.named('cfCoremodJar').flatMap { it.archiveFile }) { into 'META-INF/jarjar' }
    from(layout.buildDirectory.dir('cf-jarjar'))
    doFirst {
        def standardJar = tasks.named('jar').get().archiveFile.get().asFile
        new JarFile(standardJar).withCloseable { archive ->
            archive.manifest.mainAttributes.each { key, value ->
                manifest.attributes([(key.toString()): value.toString()])
            }
        }
    }
}

tasks.register('jvmtiBackendJar', Jar) {
    group = 'build'
    description = 'Packages the optional JVMTI backend; JNA is supplied by the game runtime.'
    dependsOn tasks.named('jvmtiClasses')
    archiveFileName.set('jvmti-backend.jar')
    destinationDirectory = layout.buildDirectory.dir('embedded-jvmti')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.jvmti.output
}

tasks.register('devJar', Jar) {
    group = 'build'
    description = 'Builds the MCreator development variant with JVMTI and development mixins.'
    dependsOn tasks.named('classes'), tasks.named('agentJar'), tasks.named('jar'), tasks.named('jvmtiBackendJar')
    archiveFileName.set("${project.archives_name}-${project.version}_dev.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        exclude 'eca.mixins.json'
    }
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        include 'META-INF/jarjar/**'
    }

    from(tasks.named('agentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
    from(tasks.named('jvmtiBackendJar').flatMap { it.archiveFile }) {
        into 'net/eca/optional'
    }

    manifest {
        attributes([
                'MixinConfigs': 'eca.mixins.dev.json'
        ])
    }
}

tasks.register('mrJar', Jar) {
    group = 'build'
    description = 'Builds the Modrinth variant from the CurseForge variant plus JVMTI.'
    dependsOn tasks.named('jar'), tasks.named('jvmtiBackendJar')
    archiveFileName.set("${project.archives_name}-${project.version}_mr.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF'
    }
    // Preserve the production manifest, including Mixin configuration, after reobfuscation.
    doFirst {
        def standardJar = tasks.named('jar').get().archiveFile.get().asFile
        new JarFile(standardJar).withCloseable { archive ->
            archive.manifest.mainAttributes.each { key, value ->
                manifest.attributes([(key.toString()): value.toString()])
            }
        }
    }
    from(tasks.named('jvmtiBackendJar').flatMap { it.archiveFile }) {
        into 'net/eca/optional'
    }
}

tasks.register('proAgentJar', Jar) {
    group = 'build'
    description = 'Packages the Pro agent with its early interception implementation.'
    dependsOn tasks.named('classes'), tasks.named('proClasses')
    archiveFileName.set('agent.jar')
    destinationDirectory = layout.buildDirectory.dir('embedded-pro-agent')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.output) {
        include 'net/eca/agent/**'
    }
    from(sourceSets.pro.output) {
        include 'net/eca/agent/**'
    }

    manifest {
        attributes(
                'Agent-Class': 'net.eca.agent.EcaAgent',
                'Premain-Class': 'net.eca.agent.EcaAgent',
                'Can-Redefine-Classes': 'true',
                'Can-Retransform-Classes': 'true'
        )
    }
}

tasks.register('proJar', Jar) {
    group = 'build'
    description = 'Builds the Pro variant from the Modrinth feature set plus Pro runtime components.'
    dependsOn tasks.named('jar'), tasks.named('jvmtiBackendJar'), tasks.named('proClasses'),
            tasks.named('proAgentJar')
    archiveFileName.set("${project.archives_name}-${project.version}_pro.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) }) {
        exclude 'META-INF/MANIFEST.MF', 'logo.png', 'net/eca/agent/agent.jar'
    }
    from sourceSets.pro.output
    from({ zipTree(file('lib/forgevm-0.7.0.jar')) }) {
        include 'forgevm/**'
    }
    from(tasks.named('jvmtiBackendJar').flatMap { it.archiveFile }) {
        into 'net/eca/optional'
    }
    from(tasks.named('proAgentJar').flatMap { it.archiveFile }) {
        into 'net/eca/agent'
        rename { 'agent.jar' }
    }
    doFirst {
        def standardJar = tasks.named('jar').get().archiveFile.get().asFile
        new JarFile(standardJar).withCloseable { archive ->
            archive.manifest.mainAttributes.each { key, value ->
                manifest.attributes([(key.toString()): value.toString()])
            }
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('cfJar'), tasks.named('mrJar'), tasks.named('devJar'), tasks.named('proJar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

// Version branch (community fork only; not the authors' code): reads .port/<minecraft_version>/branch.properties
// for what gradle.properties cannot say (Java toolchain, dependency swaps, the client's game directory).
apply from: '.port/branch.gradle'
